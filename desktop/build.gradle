plugins {
  id 'java'
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.12.0"
  runtimeOnly "com.badlogicgames.gdx:gdx-platform:1.12.0:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-freetype:1.12.0"
  runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:1.12.0:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
}
sourceCompatibility = 1.8
sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = ["../assets"]

project.ext.mainClassName = "main.java.DesktopLauncher"
project.ext.assetsDir = new File("../assets")

import org.gradle.internal.os.OperatingSystem

tasks.register('run', JavaExec) {
  dependsOn classes
  mainClass = project.mainClassName
  classpath = sourceSets.main.runtimeClasspath
  standardInput = System.in
  workingDir = project.assetsDir
  ignoreExitValue = true

  if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
    // Required to run on macOS
    jvmArgs += "-XstartOnFirstThread"
  }
}

tasks.register('debug', JavaExec) {
  dependsOn classes
  mainClass = project.mainClassName
  classpath = sourceSets.main.runtimeClasspath
  standardInput = System.in
  workingDir = project.assetsDir
  ignoreExitValue = true
  debug = true
}

tasks.register('dist', Jar) {
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  manifest {
    attributes 'Main-Class': project.mainClassName
  }
  dependsOn configurations.runtimeClasspath
  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }
  with jar
}


dist.dependsOn classes

eclipse.project.name = appName + "-desktop"

